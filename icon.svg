<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#151921"/>
      <stop offset="100%" stop-color="#090b0e"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#242b38" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Ambient Flare -->
  <circle cx="256" cy="240" r="140" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>

  <!-- Stylized Indian Rupee Currency Glyph -->
  <g fill="none" stroke="url(#brandGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Horizontal Bar -->
    <path d="M160 148 H352" stroke-width="36"/>
    <!-- Second Horizontal Bar -->
    <path d="M160 216 H312" stroke-width="36"/>
    <!-- Central Vertical Stem & Loop -->
    <path d="M228 148 V284 H268 C324 284 348 244 348 216 C348 184 324 148 268 148" stroke-width="36"/>
    <!-- Diagonal Leg -->
    <path d="M244 284 L352 384" stroke-width="38"/>
  </g>

  <!-- Decorative Accent Dot -->
  <circle cx="372" cy="148" r="14" fill="#10b981"/>
</svg>

